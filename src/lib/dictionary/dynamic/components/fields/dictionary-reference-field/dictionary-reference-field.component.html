<p-autocomplete class="argent-reference-field"
    optionLabel="label"
    appendTo="body"
    [fluid]="true"
    [dropdown]="true"
    [forceSelection]="true"
    [showEmptyMessage]="true"
    [emptyMessage]="emptyMessage()"
    [disabled]="field.readOnly || loading()"
    [placeholder]="field.placeholder || 'Найдите запись справочника'"
    [suggestions]="suggestions()"
    [ngModel]="selected()"
    [ngModelOptions]="{ standalone: true }"
    (completeMethod)="search($event)"
    (ngModelChange)="choose($event)"
></p-autocomplete>
@if (loading()) {
    <small class="argent-reference-field__hint">Загрузка выбранной записи…</small>
}
@if (error()) {
    <small class="argent-reference-field__error">{{ error() }}</small>
}
