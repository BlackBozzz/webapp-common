<div class="argent-table-toolbar">
    @if (title || totalRecords !== undefined) {
        <div class="argent-table-toolbar__heading">
            @if (title) {
                <h2 class="argent-table-toolbar__title">{{ title }}</h2>
            }
            @if (totalRecords !== undefined) {
                <span class="argent-table-toolbar__count">{{ totalRecords }} записей</span>
            }
        </div>
    }

    <div class="argent-table-toolbar__tools">
        <div class="argent-table-toolbar__actions">
            @if (showRefresh) {
                <button pButton
                    class="argent-table-toolbar__button"
                    type="button"
                    icon="pi pi-refresh"
                    severity="secondary"
                    [outlined]="true"
                    [disabled]="loading"
                    (click)="refreshRequested.emit()"
                >Обновить</button>
            }
            @if (startTemplate) {
                <ng-container *ngTemplateOutlet="startTemplate"></ng-container>
            }
            @if (endTemplate) {
                <ng-container *ngTemplateOutlet="endTemplate"></ng-container>
            }
        </div>

        <div class="argent-table-toolbar__transfers">
            @if (showExport) {
                <button pButton
                    class="argent-table-toolbar__button"
                    type="button"
                    icon="pi pi-download"
                    severity="secondary"
                    [outlined]="true"
                    [disabled]="loading || exportDisabled || !exportFormats.length"
                    (click)="openExport($event)"
                >Экспорт</button>
                <p-menu #exportMenu
                    appendTo="body"
                    [model]="exportItems"
                    [popup]="true"
                ></p-menu>
            }
            @if (showImport) {
                <button pButton
                    class="argent-table-toolbar__button"
                    type="button"
                    icon="pi pi-upload"
                    severity="secondary"
                    [outlined]="true"
                    [disabled]="loading || importDisabled"
                    (click)="importRequested.emit()"
                >Импорт</button>
            }
        </div>
    </div>
</div>
