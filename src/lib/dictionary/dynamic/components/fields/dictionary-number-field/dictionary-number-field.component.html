<input pInputText
    class="argent-field__control"
    type="text"
    [attr.inputmode]="field.type === 'integer' ? 'numeric' : 'decimal'"
    [attr.placeholder]="field.placeholder || (field.type === 'integer' ? 'Целое число' : 'Число')"
    [readonly]="field.readOnly"
    [formControl]="control"
/>
@if (field.minimum !== null || field.maximum !== null) {
    <small class="argent-number-field__hint">
        @if (field.minimum !== null && field.maximum !== null) {
            От {{ field.minimum }} до {{ field.maximum }}
        } @else if (field.minimum !== null) {
            Не меньше {{ field.minimum }}
        } @else {
            Не больше {{ field.maximum }}
        }
    </small>
}
