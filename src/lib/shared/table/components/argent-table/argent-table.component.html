<div class="argent-table">
    <argent-table-toolbar
        [title]="title"
        [totalRecords]="recordCount"
        [loading]="loading"
        [showRefresh]="showRefresh"
        [showExport]="showExport"
        [showImport]="showImport"
        [exportDisabled]="exportDisabled || exportLoading"
        [importDisabled]="importDisabled"
        [exportFormats]="exportFormats"
        [startTemplate]="toolbarStart?.template"
        [endTemplate]="toolbarEnd?.template"
        (refreshRequested)="requestRefresh()"
        (exportRequested)="requestExport($event)"
        (importRequested)="importRequested.emit()"
    ></argent-table-toolbar>

    @if (showSearch) {
        <div class="argent-table__search">
            <i class="pi pi-search" aria-hidden="true"></i>
            <input pInputText
                type="search"
                placeholder="Поиск по таблице"
                aria-label="Поиск по таблице"
                [value]="search"
                (input)="changeSearch($event)"
            />
        </div>
    }

    @if (exportError) {
        <p class="argent-table__error" role="alert">{{ exportError }}</p>
    }

    <ag-grid-angular class="argent-table__grid"
        [style.height]="height"
        [theme]="gridTheme"
        [rowModelType]="lazy ? 'infinite' : 'clientSide'"
        [rowData]="lazy ? undefined : displayedRows"
        [columnDefs]="gridColumns"
        [defaultColDef]="gridDefaultColumn"
        [rowSelection]="rowSelectionConfig"
        [getRowId]="getRowId"
        [cacheBlockSize]="pageSize"
        [maxBlocksInCache]="6"
        [maxConcurrentDatasourceRequests]="1"
        [blockLoadDebounceMillis]="55"
        [rowBuffer]="2"
        [suppressColumnVirtualisation]="gridColumns.length <= 36"
        [rowHeight]="48"
        [headerHeight]="showFilters && hasFilters ? 88 : 46"
        [loading]="!lazy && loading"
        [animateRows]="false"
        [suppressRowHoverHighlight]="false"
        [localeText]="gridLocale"
        (gridReady)="onGridReady($event)"
        (sortChanged)="onGridSortChanged($event)"
        (selectionChanged)="onGridSelectionChanged($event)"
        (rowDoubleClicked)="onGridRowDoubleClicked($event)"
    ></ag-grid-angular>

    <div class="argent-table__footer">
        <span>{{ recordCount }} записей</span>
        <span>Прокрутите таблицу, чтобы просмотреть следующие записи</span>
    </div>

    <argent-table-binary-preview
        [value]="binaryPreviewValue"
        [visible]="binaryDialogVisible"
        (visibleChange)="closeBinaryPreview($event)"
    ></argent-table-binary-preview>

    <!-- Описания колонок должны оставаться в Angular content tree. -->
    <div class="argent-table__definitions" aria-hidden="true">
        <ng-content></ng-content>
    </div>
</div>
