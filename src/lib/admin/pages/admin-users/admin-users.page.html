<section class="argent-users">
    <div class="argent-users__heading">
        <div>
            <span class="argent-users__eyebrow">Администрирование</span>
            <h1>Пользователи</h1>
        </div>

    </div>

    @if (error()) {
        <div class="argent-users__error" role="alert">{{ error() }}</div>
    }

    <argent-table title="Пользователи"
        rowKey="id"
        selectionMode="none"
        [rows]="page()?.items ?? []"
        [loading]="loading()"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [totalRecords]="page()?.totalElements ?? 0"
        [search]="searchText()"
        [showFilters]="false"
        (queryChange)="paginate($event)"
        (refreshRequested)="refresh()"
    >
        <ng-template argentTableToolbarEnd>
            <button pButton
                type="button"
                icon="pi pi-plus"
                (click)="openCreate()"
            >Добавить</button>
        </ng-template>
        <argent-table-column field="login"
            header="Логин"
            width="150px"
        ></argent-table-column>
        <argent-table-column field="displayName"
            header="Имя"
        ></argent-table-column>
        <argent-table-column field="email"
            header="Email"
            minWidth="200px"
        ></argent-table-column>
        <argent-table-column field="roles"
            header="Роли"
            type="custom"
            minWidth="355px"
            width="355px"
        >
            <ng-template argentTableCell let-user>
                <p-multiselect appendTo="body"
                    class="argent-users__role-select"
                    display="chip"
                    placeholder="Без ролей"
                    tooltipPosition="top"
                    [pTooltip]="roleTooltip(user.roles)"
                    [tooltipDisabled]="!user.roles.length"
                    [maxSelectedLabels]="2"
                    selectedItemsLabel="Выбрано ролей: {0}"
                    optionLabel="label"
                    optionValue="value"
                    [options]="roleOptions()"
                    [ngModel]="user.roles"
                    [filter]="roleOptions().length > 7"
                    [showToggleAll]="false"
                    [disabled]="isBusy(user)"
                    [fluid]="true"
                    [attr.aria-label]="'Роли пользователя ' + user.login"
                    (ngModelChange)="changeRoles(user, $event)"
                    (onPanelHide)="saveRoles(user)"
                ></p-multiselect>
            </ng-template>
        </argent-table-column>
        <argent-table-column field="enabled"
            header="Активен"
            type="custom"
        >
            <ng-template argentTableCell let-user>
                <p-toggleswitch [ngModel]="user.enabled"
                    [disabled]="isBusy(user)"
                    [attr.aria-label]="'Активен: ' + user.login"
                    (onChange)="toggleEnabled(user, $event.checked)"
                ></p-toggleswitch>
            </ng-template>
        </argent-table-column>
        <argent-table-column field="hasPassword"
            header="Пароль"
            type="custom"
        >
            <ng-template argentTableCell let-user>
                @if (user.hasPassword) {
                    <p-tag severity="success" value="Задан"></p-tag>
                } @else {
                    <p-tag severity="secondary" value="Нет"></p-tag>
                }
            </ng-template>
        </argent-table-column>
        <argent-table-column field="createdAt"
            header="Создан"
            type="datetime"
            width="165px"
        ></argent-table-column>
        <argent-table-column field="id"
            header="Действия"
            type="actions"
            minWidth="275px"
        >
            <ng-template argentTableCell let-user>
                <div class="argent-users__row-actions">
                    <button pButton
                        type="button"
                        size="small"
                        severity="secondary"
                        [outlined]="true"
                        [disabled]="isBusy(user)"
                        (click)="openEmail(user)"
                    >Email</button>
                    <button pButton
                        type="button"
                        size="small"
                        severity="secondary"
                        [outlined]="true"
                        [disabled]="isBusy(user)"
                        (click)="openPassword(user)"
                    >Задать пароль</button>
                    <button pButton
                        pTooltip="Завершить все сессии пользователя"
                        type="button"
                        size="small"
                        severity="danger"
                        tooltipPosition="top"
                        [outlined]="true"
                        [disabled]="isBusy(user)"
                        (click)="confirmRevoke(user)"
                    >Отозвать сессии</button>
                </div>
            </ng-template>
        </argent-table-column>
    </argent-table>

    <p-dialog header="Новый пользователь"
        [modal]="true"
        [closable]="!creating()"
        [draggable]="false"
        [resizable]="false"
        [style]="{ width: 'min(480px, 96vw)' }"
        [visible]="createVisible()"
        (visibleChange)="!$event && closeCreate()"
    >
        <form class="argent-users__form" id="argent-user-create-form" [formGroup]="createForm" (ngSubmit)="create()" novalidate>
            <div class="argent-users__field">
                <label for="argent-user-login">Логин</label>
                <input pInputText id="argent-user-login" formControlName="login" autocomplete="off" [fluid]="true" />
                <argent-field-error [control]="createForm.controls.login" />
            </div>
            <div class="argent-users__field">
                <label for="argent-user-display-name">Имя</label>
                <input pInputText id="argent-user-display-name" formControlName="displayName" autocomplete="off" [fluid]="true" />
                <argent-field-error [control]="createForm.controls.displayName" />
            </div>
            <div class="argent-users__field">
                <label for="argent-user-email">Email <span class="argent-users__hint">(необязательно)</span></label>
                <input pInputText formControlName="email"
                    id="argent-user-email"
                    type="email"
                    autocomplete="email"
                    [fluid]="true"
                />
                <argent-field-error [control]="createForm.controls.email" />
            </div>
            <div class="argent-users__field">
                <label for="argent-user-password">Пароль <span class="argent-users__hint">(необязательно)</span></label>
                <input pInputText id="argent-user-password" type="password" formControlName="password"
                    autocomplete="new-password" [fluid]="true" />
                <argent-field-error [control]="createForm.controls.password" />
            </div>
        </form>
        <ng-template #footer>
            <button pButton
                type="button"
                severity="secondary"
                [disabled]="creating()"
                (click)="closeCreate()"
            >Отмена</button>
            <button pButton
                type="submit"
                form="argent-user-create-form"
                [loading]="creating()"
            >Создать</button>
        </ng-template>
    </p-dialog>

    <p-dialog
        header="Email пользователя"
        [modal]="true"
        [closable]="!savingEmail()"
        [draggable]="false"
        [resizable]="false"
        [style]="{ width: 'min(420px, 96vw)' }"
        [visible]="emailUser() !== null"
        (visibleChange)="!$event && closeEmail()"
    >
        <form
            class="argent-users__form"
            id="argent-user-email-form"
            [formGroup]="emailForm"
            (ngSubmit)="saveEmail()"
        >
            <div class="argent-users__field">
                <label for="argent-user-edit-email">Email (пустое поле удалит адрес)</label>
                <input pInputText formControlName="email"
                    id="argent-user-edit-email"
                    type="email"
                    autocomplete="email"
                    [fluid]="true"
                />
                <argent-field-error [control]="emailForm.controls.email" />
            </div>
        </form>
        <ng-template #footer>
            <button pButton
                type="button"
                severity="secondary"
                [disabled]="savingEmail()"
                (click)="closeEmail()"
            >Отмена</button>
            <button pButton
                type="submit"
                form="argent-user-email-form"
                [loading]="savingEmail()"
            >Сохранить</button>
        </ng-template>
    </p-dialog>

    <p-dialog [header]="'Пароль пользователя ' + (passwordUser()?.login ?? '')"
        [modal]="true"
        [closable]="!savingPassword()"
        [draggable]="false"
        [resizable]="false"
        [style]="{ width: 'min(420px, 96vw)' }"
        [visible]="passwordUser() !== null"
        (visibleChange)="!$event && closePassword()"
    >
        <form class="argent-users__form" id="argent-user-password-form" [formGroup]="passwordForm" (ngSubmit)="savePassword()" novalidate>
            <div class="argent-users__field">
                <label for="argent-user-new-password">Новый пароль</label>
                <input pInputText id="argent-user-new-password" type="password" formControlName="password"
                    autocomplete="new-password" [fluid]="true" />
                <argent-field-error [control]="passwordForm.controls.password" />
            </div>
        </form>
        <ng-template #footer>
            <button pButton
                type="button"
                severity="secondary"
                [disabled]="savingPassword()"
                (click)="closePassword()"
            >Отмена</button>
            <button pButton
                type="submit"
                form="argent-user-password-form"
                [loading]="savingPassword()"
            >Сохранить</button>
        </ng-template>
    </p-dialog>

    <p-confirmdialog></p-confirmdialog>
    <p-toast></p-toast>
</section>
