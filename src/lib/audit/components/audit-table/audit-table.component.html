<argent-table title="Журнал изменений"
    rowKey="id"
    selectionMode="none"
    [rows]="page()?.items ?? []"
    [loading]="loading()"
    [pageIndex]="page()?.page ?? 0"
    [pageSize]="pageSize()"
    [totalRecords]="page()?.totalElements ?? 0"
    [showSearch]="false"
    [showFilters]="false"
    (queryChange)="paginate($event)"
    (refreshRequested)="refresh()"
>
    <argent-table-column field="createdAt"
        header="Когда"
        type="datetime"
        width="160px"
    ></argent-table-column>
    <argent-table-column field="actorLogin"
        header="Кто"
        type="string"
    ></argent-table-column>
    <argent-table-column field="action"
        header="Действие"
        type="status"
        [labelMap]="actionLabels"
    ></argent-table-column>
    @if (showEntity()) {
        <argent-table-column field="entityType"
            header="Таблица"
        ></argent-table-column>
        <argent-table-column field="entityId"
            header="Запись"
        ></argent-table-column>
    }
    <argent-table-column field="field"
        header="Поле"
    ></argent-table-column>
    <argent-table-column field="oldValue"
        header="Было"
        type="text"
    ></argent-table-column>
    <argent-table-column field="newValue"
        header="Стало"
        type="text"
    ></argent-table-column>
</argent-table>
