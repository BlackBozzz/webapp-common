<section class="argent-records">
    <div class="argent-records__back">
        <a routerLink="../"
        >← Все справочники</a>
    </div>
    <div class="argent-records__heading">
        <div>
            <span class="argent-records__eyebrow">Справочник · {{ code() }}</span>
            <h1>{{ title() }}</h1>
        </div>
    </div>

    @if (error()) {
        <div class="argent-records__error" role="alert">{{ error() }}</div>
    }
    @if (schema()) {
        <argent-table [title]="title()"
            [rows]="page()?.items ?? []"
            [rowKey]="schema()?.idField || 'id'"
            [loading]="loading()"
            [pageIndex]="pageIndex()"
            [pageSize]="pageSize()"
            [totalRecords]="page()?.totalElements ?? 0"
            [selected]="selected()"
            [search]="searchText()"
            [filters]="filters()"
            [sort]="sortQuery()"
            [showExport]="canRead()"
            [showImport]="canImport()"
            [exportDisabled]="exporting()"
            exportMode="external"
            (queryChange)="changeQuery($event)"
            (selectionChange)="changeSelection($event)"
            (refreshRequested)="refresh()"
            (exportRequested)="exportTable($event)"
            (importRequested)="openImport()"
            (rowDoubleClick)="openRow($event)"
        >
            <ng-template argentTableToolbarEnd>
                @if (canWrite()) {
                    <button pButton
                        type="button"
                        icon="pi pi-plus"
                        (click)="add()"
                    >Добавить</button>
                    <button pButton
                        type="button"
                        icon="pi pi-pencil"
                        severity="secondary"
                        [disabled]="!selected() || loading()"
                        (click)="edit()"
                    >Редактировать</button>
                    <button pButton
                        type="button"
                        icon="pi pi-trash"
                        severity="danger"
                        [outlined]="true"
                        [disabled]="!selected() || deleting() || loading()"
                        (click)="remove()"
                    >Удалить</button>
                } @else if (canRead()) {
                    <button pButton
                        type="button"
                        severity="secondary"
                        [disabled]="!selected() || loading()"
                        (click)="edit()"
                    >Открыть</button>
                }
            </ng-template>
            @for (field of tableColumns(); track field.name) {
                <argent-table-column [field]="field.name"
                    [header]="field.label"
                    [type]="columnType(field)"
                    [sortable]="sortableColumn(field)"
                    [filterable]="filterableColumn(field)"
                    [displayField]="field.reference?.displayField ?? undefined"
                    [labelMap]="field.enumLabels ?? undefined"
                    [filterType]="field.type"
                    [filterOptions]="enumFilterOptions(field)"
                ></argent-table-column>
            }
        </argent-table>
    } @else if (loading()) {
        <p class="argent-records__loading">Загрузка описания справочника…</p>
    }

    <argent-dictionary-record-dialog [code]="code()"
        [schema]="schema()"
        [recordId]="editingId()"
        [visible]="dialogVisible()"
        [readonly]="!canWrite()"
        (visibleChange)="dialogVisible.set($event)"
        (saved)="onSaved()"
    ></argent-dictionary-record-dialog>
    @if (canImport()) {
        <argent-dictionary-import-dialog [code]="code()"
            [visible]="importVisible()"
            (visibleChange)="importVisible.set($event)"
            (imported)="onImported()"
        ></argent-dictionary-import-dialog>
    }
    <p-confirmdialog></p-confirmdialog>
    <p-toast></p-toast>
    <!-- Toast с ключом argent: сообщения вложений и истории в диалоге записи (MessageService страницы). -->
    <p-toast key="argent" position="bottom-right"></p-toast>
</section>
