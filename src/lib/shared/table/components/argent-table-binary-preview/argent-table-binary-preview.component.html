<p-dialog header="Бинарное вложение"
    appendTo="body"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: 'min(760px, 94vw)' }"
    [visible]="visible"
    (visibleChange)="!$event && close()"
>
    @if (error) {
        <p class="argent-binary-preview__error" role="alert">{{ error }}</p>
    } @else {
        <div class="argent-binary-preview__meta">
            <i class="pi pi-file" aria-hidden="true"></i>
            <div>
                <strong>{{ fileName }}</strong>
                <span>{{ fileSize }} · {{ mimeType }}</span>
            </div>
        </div>
        @if (previewUrl) {
            <div class="argent-binary-preview__image">
                <img alt="Предпросмотр вложения"
                    [src]="previewUrl"
                />
            </div>
        } @else if (pdfUrl) {
            <iframe class="argent-binary-preview__pdf"
                title="Предпросмотр PDF"
                [src]="pdfUrl"
            ></iframe>
        } @else {
            <p class="argent-binary-preview__notice">
                Для этого формата встроенный просмотр недоступен. Файл можно скачать.
            </p>
        }
    }
    <ng-template #footer>
        <button pButton
            type="button"
            severity="secondary"
            [outlined]="true"
            (click)="close()"
        >Закрыть</button>
        <button pButton
            type="button"
            icon="pi pi-download"
            [disabled]="!!error"
            (click)="download()"
        >Скачать</button>
    </ng-template>
</p-dialog>
