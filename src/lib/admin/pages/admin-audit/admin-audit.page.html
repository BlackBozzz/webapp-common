<section class="argent-audit">
    <div class="argent-audit__heading">
        <div>
            <span class="argent-audit__eyebrow">Администрирование</span>
            <h1>Журнал изменений</h1>
        </div>
        <div class="argent-audit__live-controls">
            <span class="argent-audit__live-state" [class.argent-audit__live-state--on]="liveConnected()">
                {{ liveConnected() ? 'WebSocket подключён' : 'Резервное обновление каждые 15 сек.' }}
            </span>
            @if (refreshedAt(); as updated) {
                <span class="argent-audit__live-state">Обновлено: {{ updated | date:'HH:mm:ss' }}</span>
            }
            <button pButton severity="secondary" type="button" [outlined]="true" [disabled]="loading()" (click)="refresh()">
                <i class="pi pi-refresh" aria-hidden="true"></i> Обновить
            </button>
        </div>
    </div>

    <form class="argent-audit__filters" (ngSubmit)="apply()">
        <label class="argent-audit__field">
            <span>Таблица</span>
            <p-select
                name="entityType"
                inputId="argent-audit-entity-type"
                [options]="tableOptions()"
                optionLabel="label"
                optionValue="value"
                [editable]="true"
                [filter]="false"
                placeholder="Все таблицы"
                appendTo="body"
                [ngModel]="entityType()"
                (ngModelChange)="entityType.set($event ?? '')"
            />
        </label>
        <label class="argent-audit__field">
            <span>Запись</span>
            <input pInputText
                name="entityId"
                placeholder="Идентификатор"
                [ngModel]="entityId()"
                (ngModelChange)="entityId.set($event ?? '')"
            />
        </label>
        <label class="argent-audit__field">
            <span>Действие</span>
            <p-select
                name="action"
                inputId="argent-audit-action"
                [options]="actionOptions"
                optionLabel="label"
                optionValue="value"
                [ngModel]="action()"
                appendTo="body"
                (ngModelChange)="action.set($event ?? '')"
            />
        </label>
        <label class="argent-audit__field">
            <span>С</span>
            <p-datepicker
                name="from"
                inputId="argent-audit-from"
                appendTo="body"
                dateFormat="dd.mm.yy"
                [showIcon]="true"
                [showClear]="true"
                [ngModel]="fromDate()"
                (ngModelChange)="fromDate.set($event)"
            />
        </label>
        <label class="argent-audit__field">
            <span>По</span>
            <p-datepicker
                name="to"
                inputId="argent-audit-to"
                appendTo="body"
                dateFormat="dd.mm.yy"
                [showIcon]="true"
                [showClear]="true"
                [ngModel]="toDate()"
                (ngModelChange)="toDate.set($event)"
            />
        </label>
        <div class="argent-audit__filter-actions">
            <button pButton type="submit">Применить</button>
            <button pButton type="button" severity="secondary" [outlined]="true" (click)="reset()">Сбросить</button>
        </div>
    </form>

    @if (error()) {
        <div class="argent-audit__error" role="alert">{{ error() }}</div>
    }

    <argent-audit-table
        [page]="page()"
        [loading]="loading()"
        [rows]="rows"
        [showEntity]="true"
        (lazyLoad)="paginate($event)"
    />
</section>
