@if (hasFile) {
    <button class="argent-table-file-cell__button"
        type="button"
        title="Просмотреть вложение"
        aria-label="Просмотреть вложение"
        (click)="$event.stopPropagation(); previewRequested.emit(value)"
        (dblclick)="$event.stopPropagation()"
    >
        <i class="pi pi-eye" aria-hidden="true"></i>
    </button>
} @else {
    <span class="argent-table-file-cell__empty">—</span>
}
