<argent-table [rows]="page?.items ?? []"
    [rowKey]="schema?.idField || 'id'"
    [loading]="loading"
    [pageIndex]="page?.page ?? 0"
    [pageSize]="page?.size ?? 20"
    [totalRecords]="page?.totalElements ?? 0"
    [selected]="selected"
    [filters]="filters"
    [showSearch]="false"
    [showRefresh]="false"
    [showExport]="false"
    (selectionChange)="selectedChange.emit($any($event))"
    (queryChange)="onTableQuery($event)"
>
    @for (field of columns; track field.name) {
        <argent-table-column [field]="field.name"
            [header]="field.label"
            [sortable]="sortable(field)"
            [filterable]="filterable(field)"
        ></argent-table-column>
    }
</argent-table>
